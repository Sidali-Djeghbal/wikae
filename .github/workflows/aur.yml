name: AUR

# When a release is published (not a pre-release), points the wikae-bin recipe on the AUR at its .deb,
# so Arch, Manjaro and Omarchy get the new version with `yay -Syu`. Needs the AUR_SSH_KEY secret,
# the private key of the AUR account that maintains wikae-bin; without it this does nothing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to point the recipe at (vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  aur:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Update and push the recipe
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then echo "No AUR_SSH_KEY secret yet: skipping."; exit 0; fi
          pacman -Syu --noconfirm --needed git openssh curl
          version=${TAG#v}
          # release-please publishes before desktop.yml finishes attaching the installer.
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Wikae-linux-amd64.deb"
          for i in $(seq 1 60); do curl -fsSL -o wikae.deb "$url" && break; sleep 30; done
          [ -s wikae.deb ] || { echo "No installer attached to $TAG"; exit 1; }
          sum=$(sha256sum wikae.deb | cut -d' ' -f1)
          mkdir -p ~/.ssh && printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' > ~/.ssh/config
          # Pinned host key: ssh-keyscan would trust whatever a network attacker presents.
          printf 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN\n' >> ~/.ssh/known_hosts
          git clone ssh://aur@aur.archlinux.org/wikae-bin.git aur
          cp desktop/aur/PKGBUILD aur/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=1/; s/^sha256sums=.*/sha256sums=('$sum')/" aur/PKGBUILD
          useradd -m builder && chown -R builder aur
          su builder -c "cd aur && makepkg --printsrcinfo > .SRCINFO"
          cd aur
          git add PKGBUILD .SRCINFO
          git -c user.name="Sidali Djeghbal" -c user.email="contact@djeghbal.me" commit -m "$version"
          git push origin HEAD:master
