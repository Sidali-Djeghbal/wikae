name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "examples/showcase/**", "runtime/**", "types/**", "schedulers/**", "web/**", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run site
      - name: Check links, anchors and release assets
        run: node site/tools/check-links.mjs
      - name: Check pages at phone and desktop widths
        run: |
          node site/tools/serve.mjs 4620 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4620/wikae/ > /dev/null 2>&1 && break; sleep 0.25; done
          for w in 320 390 1440; do
            node site/tools/check.mjs http://127.0.0.1:4620/wikae/ /tmp/wikae-check-$w index.html $w
          done
          node site/tools/check.mjs http://127.0.0.1:4620/wikae/ /tmp/wikae-check-download download.html 1440
          node site/tools/check.mjs http://127.0.0.1:4620/wikae/ /tmp/wikae-check-sync sync.html 390
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
