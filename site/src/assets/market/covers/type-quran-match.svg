<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2d44"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e9c46a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e9c46a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <!-- Islamic Pattern Border -->
  <rect x="20" y="20" width="600" height="360" rx="16" fill="none" stroke="#e9c46a" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="28" y="28" width="584" height="344" rx="12" fill="none" stroke="#e9c46a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Corner motifs -->
  <g fill="#e9c46a" fill-opacity="0.4">
    <polygon points="36,36 48,36 36,48"/>
    <polygon points="604,36 592,36 604,48"/>
    <polygon points="36,364 48,364 36,352"/>
    <polygon points="604,364 592,364 604,352"/>
  </g>

  <!-- Central Badge -->
  <circle cx="320" cy="140" r="54" fill="#e9c46a" fill-opacity="0.12" stroke="#e9c46a" stroke-width="2" stroke-opacity="0.5"/>
  <text x="320" y="156" font-size="44" text-anchor="middle" font-family="system-ui, sans-serif">🔗</text>

  <!-- Wikae Brand Tag -->
  <text x="320" y="222" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#e9c46a" font-family="system-ui, sans-serif">WIKAE · وِكَاء</text>

  <!-- Title -->
  <text x="320" y="268" font-size="28" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" direction="rtl">وصل المفردات وتفسير الغريب</text>

  <!-- Subtitle -->
  <text x="320" y="304" font-size="16" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" direction="rtl">ربط الكلمة القرآنية ببيانها التفسيري</text>
</svg>