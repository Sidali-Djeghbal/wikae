<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<!-- The social share image (site/src/assets/og.png). Render with site/tools/shoot.mjs after a build. -->
<link rel="stylesheet" href="../../dist/assets/site.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .og { position: relative; height: 100%; display: grid; grid-template-columns: 1.15fr 0.85fr; align-items: center; gap: 3rem; padding: 0 4.5rem; isolation: isolate; }
  .og .hero-bg { inset: 0; }
  .og h1 { font-size: 3.6rem; line-height: 1.25; font-weight: 700; margin: 1.4rem 0 0; }
  .og h1 em { font-style: normal; font-family: "Aref Ruqaa", var(--font-serif); color: var(--highlight); font-size: 1.08em; }
  .og .wordmark { font-size: 2.6rem; font-weight: 700; }
  .og p { color: var(--muted-foreground); font-size: 1.25rem; line-height: 1.7; margin: 1.2rem 0 0; max-width: 32rem; }
  .og .url { position: absolute; right: 4.5rem; bottom: 2.4rem; font: 0.95rem var(--font-mono); color: var(--muted-foreground); direction: ltr; }
  .og img { width: 100%; border-radius: 1rem; border: 1px solid var(--border); box-shadow: 0 30px 80px -30px #000; }
</style></head>
<body><div class="og">
  <div class="hero-bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div></div>
  <div>
    <div class="wordmark">وِكَاء · Wikae</div>
    <h1>اضبط المتشابهات. <em>وثبّت المحفوظات.</em></h1>
    <p>تطبيق مجاني ومفتوح المصدر لحفظ القرآن الكريم وإتقان المتشابهات بالاستدعاء النشط وخوارزمية FSRS-6.</p>
  </div>
  <img src="../../src/assets/market/covers/deck-quran-mutashabihat.svg" alt="">
  <div class="url">github.com/Sidali-Djeghbal/wikae</div>
</div></body></html>
