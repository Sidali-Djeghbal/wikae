<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<!-- The social share image (site/src/assets/og.png). Build the site, then render with site/tools/shoot.mjs (1200x630, scale 1). -->
<link rel="stylesheet" href="../../dist/assets/site.css">
<style>
  * { box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; background: #07120f; font-family: "IBM Plex Sans Arabic", "Cairo", sans-serif; color: #f2efe6; }
  .og { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(900px 520px at 85% 20%, #0f3a2d 0%, #07120f 70%); }
  .og::before { content: ""; position: absolute; inset: 0; opacity: .5; background: repeating-linear-gradient(45deg, transparent 0 59px, rgba(111, 207, 160, .07) 59px 60px), repeating-linear-gradient(-45deg, transparent 0 59px, rgba(111, 207, 160, .07) 59px 60px); }
  .copy { position: absolute; top: 0; bottom: 0; right: 0; width: 600px; padding: 64px 64px 56px 0; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { height: 54px; width: auto; align-self: flex-start; }
  h1 { margin: 0; font-size: 46px; line-height: 1.65; font-weight: 700; max-width: none; letter-spacing: 0; }
  h1 span { display: block; }
  h1 em { font-style: normal; color: #6fcfa0; }
  p { margin: 18px 0 0; font-size: 23px; line-height: 1.8; font-weight: 400; color: #b9c4bd; }
  .meta { display: flex; justify-content: space-between; align-items: center; font: 500 17px/1 "IBM Plex Sans Arabic", sans-serif; color: #7f8f87; direction: ltr; }
  .meta b { color: #d9b45a; font-weight: 600; letter-spacing: .08em; }
  .shot { position: absolute; left: 40px; top: 120px; width: 520px; height: 400px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 40px 90px -20px rgba(0, 0, 0, .8); overflow: hidden; direction: ltr; background: #0b0b0b; }
  .shot img { display: block; width: 820px; max-width: none; margin: -82px 0 0 -150px; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #d9b45a, #6fcfa0); }
</style></head>
<body><div class="og">
  <div class="shot"><img src="../../src/assets/shots/app-study.webp" alt=""></div>
  <div class="copy">
    <img class="logo" src="../../src/assets/logo_white.svg" alt="">
    <div>
      <h1><span>اضبط المتشابهات.</span><span><em>وثبّت المحفوظات.</em></span></h1>
      <p>تطبيق مجاني ومفتوح المصدر لحفظ القرآن الكريم، يعمل دون اتصال بخوارزمية FSRS-6.</p>
    </div>
    <div class="meta"><span>github.com/Sidali-Djeghbal/wikae</span><b>WIKAE</b></div>
  </div>
  <div class="rule"></div>
</div></body></html>
